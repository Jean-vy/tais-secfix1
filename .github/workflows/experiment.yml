# Ejecuta el experimento C0 vs C1. Necesita el secret LLM_API_KEY (y opcionalmente
# las variables LLM_ENDPOINT y LLM_MODEL).
# Actions > experiment > Run workflow. Descarga el artefacto con los resultados.
name: experiment
on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Configuraciones (C0, C1, C1b)"
        default: "C0,C1"
      reps:
        description: "Repeticiones"
        default: "1"
      rep_offset:
        description: "Primera repetición (para continuar otro día)"
        default: "0"
      model:
        description: "Modelo del LLM (vacío = variable LLM_MODEL o llama-3.3-70b-versatile)"
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt matplotlib
      - name: Ejecutar experimento
        env:
          SECFIX_LLM_TOKEN: ${{ secrets.LLM_API_KEY }}
          SECFIX_LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          SECFIX_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
        run: |
          python experiment/run_experiment.py --configs "${{ inputs.configs }}" \
            --reps "${{ inputs.reps }}" --rep-offset "${{ inputs.rep_offset }}" \
            --out "experiment/results/runs_r${{ inputs.rep_offset }}.jsonl" || echo "Experimento detenido (ver log)"
          python experiment/analyze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-experimento-r${{ inputs.rep_offset }}
          path: experiment/results/
